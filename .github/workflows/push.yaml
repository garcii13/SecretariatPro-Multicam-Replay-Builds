name: Push
run-name: ${{ github.ref_name }} push run 🚀
on:
  push:
    branches:
      - master
      - main
      - 'release/**'
    tags:
      - '*'
permissions:
  contents: write
jobs:
  check-format:
    name: Check Formatting 🔍
    if: github.ref_name == 'master' || github.ref_name == 'main'
    uses: ./.github/workflows/check-format.yaml
    permissions:
      contents: read

  build-project:
    name: Build Project 🧱
    uses: ./.github/workflows/build-project.yaml
    secrets: inherit
    permissions:
      contents: write

  create-release:
    name: Verify Draft Release 🛫
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    needs: build-project
    defaults:
      run:
        shell: bash
    steps:
      - name: Verify Installers ☑️
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          : Verify Installers ☑️
          assets="$(gh release view "${GITHUB_REF_NAME}" --json assets --jq '.assets[].name')"
          if ! grep -Eq '\.(pkg|tar\.xz)$' <<< "${assets}"; then
            echo 'Falta el instalador macOS en la versión.' >&2
            exit 1
          fi
          if ! grep -Eq '\.(exe|zip)$' <<< "${assets}"; then
            echo 'Falta el instalador Windows en la versión.' >&2
            exit 1
          fi
